apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer-role
  namespace: todo-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-binding
  namespace: todo-app
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: todo-app
roleRef:
  kind: Role
  name: viewer-role
  apiGroup: rbac.authorization.k8s.io
