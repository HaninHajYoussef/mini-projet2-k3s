# Un ServiceAccount par composant, sans jeton monté (ils n'appellent jamais l'API Kubernetes)
apiVersion: v1
kind: ServiceAccount
metadata: { name: api-sa, namespace: todo-app }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend-sa, namespace: todo-app }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: db-sa, namespace: todo-app }
automountServiceAccountToken: false
---
# Compte de consultation (lecture seule)
apiVersion: v1
kind: ServiceAccount
metadata: { name: dev-viewer, namespace: todo-app }
